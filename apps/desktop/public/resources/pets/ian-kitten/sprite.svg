<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="96" viewBox="0 0 1344 96" role="img" aria-label="Ian kitten sprite sheet">
  <defs>
    <style>
      .shadow { fill: #26312d; opacity: 0.16; }
