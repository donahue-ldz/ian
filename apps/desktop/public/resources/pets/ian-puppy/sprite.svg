<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="96" viewBox="0 0 1728 96" data-style="rounded-puppy-v2">
  <defs>
    <style>
      .line{stroke:#2b1a2c;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
