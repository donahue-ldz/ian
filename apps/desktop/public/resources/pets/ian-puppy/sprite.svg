      <path class="inner" d="M68 30c0-5-5-7-9-2 4 1 7 3 9 6z"/>

      <ellipse cx="48" cy="43" rx="29" ry="25" class="fur2 line"/>
      <path class="cream" d="M23 45c3-14 15-22 25-22s22 8 25 22c1 15-9 25-25 25S22 60 23 45z"/>
      <path class="fur" d="M29 42c5-12 13-18 19-18s15 6 19 18c-7-4-31-4-38 0z"/>
