      <circle class="cheek" cx="64" cy="43" r="3"/>
      <circle class="cheek" cx="82" cy="43" r="3"/>
    </g>
    <g id="legs-neutral">
      <rect class="wool" x="28" y="66" width="9" height="18" rx="4"/>
      <rect class="wool" x="54" y="66" width="9" height="18" rx="4"/>
    </g>
    <g id="legs-left">
