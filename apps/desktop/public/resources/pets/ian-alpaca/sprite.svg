      <path class="face" d="M69 47q4 4 8 0"/>
    </g>
    <g id="face-sleep">
      <path class="face" d="M64 37h6"/>
      <path class="face" d="M75 37h6"/>
      <path class="face" d="M70 47q3 2 6 0"/>
    </g>
    <g id="face-rest">
