<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="96" viewBox="0 0 1536 96" role="img" aria-label="Ian alpaca sprite sheet">
  <defs>
    <style>
      .shadow { fill: #29352f; opacity: 0.16; }
      .wool { fill: #f4f1e8; stroke: #5a6b60; stroke-width: 3; }
      .face { fill: none; stroke: #314138; stroke-width: 2; stroke-linecap: round; }
      .eye { fill: #314138; }
      .cheek { fill: #f0b7a4; opacity: 0.5; }
    </style>
    <g id="body">
      <rect class="wool" x="20" y="38" width="50" height="34" rx="17"/>
      <rect class="wool" x="58" y="22" width="28" height="34" rx="12"/>
      <rect class="wool" x="62" y="5" width="9" height="24" rx="5" transform="rotate(-12 66 17)"/>
      <rect class="wool" x="76" y="6" width="9" height="24" rx="5" transform="rotate(10 80 18)"/>
    </g>
    <g id="face-smile">
      <circle class="eye" cx="67" cy="37" r="2.5"/>
