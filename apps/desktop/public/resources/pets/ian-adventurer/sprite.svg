<svg xmlns="http://www.w3.org/2000/svg" width="3456" height="96" viewBox="0 0 3456 96" shape-rendering="crispEdges" data-style="pixel-adventurer-v1" data-style-kind="pixel-sprite" data-line-tone="soft-arcade" data-pixel-grid="4">
  <defs>
